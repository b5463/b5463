<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="132" viewBox="0 0 1000 132" role="img" aria-labelledby="title desc">
  <title id="title">KINO D4 ASCII capture loop</title>
  <desc id="desc">A compact animated ASCII strip cycling through four camera viewpoints.</desc>
  <defs>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#4f2d17"/>
      <stop offset=".5" stop-color="#a36936"/>
      <stop offset="1" stop-color="#57301a"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font-size: 12px; letter-spacing: 2px; fill: #aeb4b6; }
      .frame { font-size: 19px; font-weight: 700; fill: #ece9df; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
  </defs>
  <rect width="1000" height="132" fill="#090a0b"/>
  <rect x="8" y="8" width="984" height="116" fill="url(#rail)" stroke="#050505" stroke-width="5"/>
  <rect x="22" y="22" width="956" height="88" fill="#0b0d0e" stroke="#aeb4b6" stroke-width="2"/>
  <circle cx="40" cy="40" r="7" fill="#202427" stroke="#737a7d"/>
  <circle cx="960" cy="92" r="7" fill="#202427" stroke="#737a7d"/>

  <g class="mono">
    <text x="52" y="49" class="label">KINO_D4 // FOUR VIEWPOINT BUFFER</text>
    <g transform="translate(52 82)" opacity="1">
      <animate class="motion" attributeName="opacity" values="1;0;0;0" keyTimes="0;.25;.5;.75" dur="3.2s" calcMode="discrete" repeatCount="indefinite"/>
      <text class="frame">[01:*]----[02:.]----[03:.]----[04:.]  //  SUBJECT @ X-03</text>
    </g>
    <g transform="translate(52 82)" opacity="0">
      <animate class="motion" attributeName="opacity" values="0;1;0;0" keyTimes="0;.25;.5;.75" dur="3.2s" calcMode="discrete" repeatCount="indefinite"/>
      <text class="frame">[01:.]----[02:*]----[03:.]----[04:.]  //  SUBJECT @ X-01</text>
    </g>
    <g transform="translate(52 82)" opacity="0">
      <animate class="motion" attributeName="opacity" values="0;0;1;0" keyTimes="0;.25;.5;.75" dur="3.2s" calcMode="discrete" repeatCount="indefinite"/>
      <text class="frame">[01:.]----[02:.]----[03:*]----[04:.]  //  SUBJECT @ X+01</text>
    </g>
    <g transform="translate(52 82)" opacity="0">
      <animate class="motion" attributeName="opacity" values="0;0;0;1" keyTimes="0;.25;.5;.75" dur="3.2s" calcMode="discrete" repeatCount="indefinite"/>
      <text class="frame">[01:.]----[02:.]----[03:.]----[04:*]  //  SUBJECT @ X+03</text>
    </g>
  </g>
</svg>